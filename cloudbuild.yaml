steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east1-docker.pkg.dev/wass-project/tourya-front/tourya-front:$COMMIT_SHA'
      - '-t'
      - 'us-east1-docker.pkg.dev/wass-project/tourya-front/tourya-front:latest'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-east1-docker.pkg.dev/wass-project/tourya-front/tourya-front'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tourya-front'
      - '--image'
      - 'us-east1-docker.pkg.dev/wass-project/tourya-front/tourya-front:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'

images:
  - 'us-east1-docker.pkg.dev/wass-project/tourya-front/tourya-front:$COMMIT_SHA'
  - 'us-east1-docker.pkg.dev/wass-project/tourya-front/tourya-front:latest'

options:
  logging: CLOUD_LOGGING_ONLY
