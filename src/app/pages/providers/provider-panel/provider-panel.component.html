<div class="row">
  <!-- Sidebar de administración -->
  <div class="col-xl-3 col-lg-4 admin-sidebar">
    <div class="card user-sidebar mb-4 mb-lg-0 theiaStickySidebar">
      <!-- Card de perfil -->
      <div class="card mb-4 p-3 d-flex flex-row align-items-center justify-content-between" style="border-radius: 2rem; border: 1px solid #e3e6ef;">
        <div class="d-flex align-items-center">
          <img src="assets/img/user-01.webp" alt="Proveedor" class="rounded-circle me-3" style="width:48px;height:48px;object-fit:cover;">
          <div>
            <div class="fw-bold">Jeffrey Wilson</div>
            <div class="text-muted small">Since 10 May 2025</div>
          </div>
        </div>
        <button class="btn btn-light rounded-circle p-2" style="box-shadow:none;">
          <i class="fa fa-pen"></i>
        </button>
      </div>
      <!-- Fin Card de perfil -->
      <div class="card-header user-sidebar-header text-center bg-gray-transparent d-none">
        <div class="agent-profile d-inline-flex">
          <img src="assets/img/iconAct.jpg" alt="image" class="img-fluid rounded-circle">
        </div>
        <h6 class="fs-16">Proveedor</h6>
      </div>
      <div class="card-body user-sidebar-body">
        <ul>
          <li>
            <a href="#" class="d-flex align-items-center" (click)="mostrarTours = false">
              <i class="isax isax-grid-55"></i> Dashboard
            </a>
          </li>
          <li>
            <a class="d-flex align-items-center" (click)="mostrarTours = true">
              <i class="isax isax-user"></i> Lista de Tour
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <!-- Fin Sidebar -->

  <!-- Contenido principal -->
  <div class="col-xl-9 col-lg-8">
    <div class="dashboard-container">
      <div *ngIf="!mostrarTours">
        <!-- Tarjetas de estadísticas -->
        <div class="row mb-4">
          <div class="col-md-4">
            <div class="card">
              <div class="card-body d-flex align-items-center">
                <span class="dashboard-icon iconred me-3">
                  <img src="assets/img/iconred.png" alt="icono rojo" class="img-fluid" style="width:75px;height:75px;">
                </span>
                <div>
                  <h5 class="mb-0">80</h5>
                  <span>Total Bookings</span>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card">
              <div class="card-body d-flex align-items-center">
                <span class="dashboard-icon icongreen me-3">
                  <img src="assets/img/icongreen.png" alt="icono verde" class="img-fluid" style="width:75px;height:75px;">
                </span>
                <div>
                  <h5 class="mb-0">$5.3K</h5>
                  <span>Total Transactions</span>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card">
              <div class="card-body d-flex align-items-center">
                <span class="dashboard-icon iconpurple me-3">
                  <img src="assets/img/iconpurple.png" alt="icono morado" class="img-fluid" style="width:75px;height:75px;">
                </span>
                <div>
                  <h5 class="mb-0">$5965</h5>
                  <span>Average Value</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Fin tarjetas de estadísticas -->
        <!-- Aquí puedes poner el contenido personalizado cuando mostrarTours sea true -->
      </div>
      <div *ngIf="mostrarTours">
        <!-- Lista de tours o tu contenido personalizado -->
      </div>
    </div>
  </div>
</div>
