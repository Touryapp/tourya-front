<!-- Page Header -->
<div class="row">
    <div class="col-md-12">
        <div class="page-title-box">
            <div class="page-title-right">
                <button class="btn btn-primary" (click)="createTemplate()">
                    <i class="isax isax-add-circle me-1"></i>
                    Crear Template
                </button>
            </div>
            <h4 class="page-title">Templates de Horarios</h4>
        </div>
    </div>
</div>

<!-- Templates Table -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-centered table-nowrap mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Label</th>
                                <th>Días de la Semana</th>

                                <th>Slots</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngIf="loading">
                                <td colspan="6" class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                </td>
                            </tr>
                            <tr *ngIf="!loading && templates.length === 0">
                                <td colspan="6" class="text-center text-muted">
                                    No hay templates configurados
                                </td>
                            </tr>
                            <tr *ngFor="let template of templates">
                                <td>{{ template.id }}</td>
                                <td>{{ template.label }}</td>
                                <td>
                                    <span *ngFor="let day of template.daysOfWeek; let last = last" 
                                          class="badge bg-primary me-1">
                                        {{ getDayAbbreviation(day) }}
                                    </span>
                                </td>

                                <td>
                                    <span class="badge bg-info">
                                        {{ template.slots.length || 0 }} slots
                                    </span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary"
                                                (click)="editTemplate(template.id!)"
                                                title="Editar">
                                            <i class="isax isax-edit-2"></i>
                                        </button>
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-danger"
                                                (click)="deleteTemplate(template.id!)"
                                                title="Eliminar">
                                            <i class="isax isax-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
