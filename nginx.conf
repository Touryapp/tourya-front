worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # TC-009 (#196): i18n JSON tiene URL fija (sin hash) y su contenido cambia
    # entre deploys. Debe refrescarse en cada carga; si no, usuarios con cache
    # viejo ven la modal con keys faltantes (fallback a ingles).
    location ~* ^/i18n/.*\.json$ {
      try_files $uri =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      expires -1;
    }

    # MO-43b: Digital Asset Links para autoVerify de deep-links Android.
    # Google descarga https://dev.tourya.co/.well-known/assetlinks.json para verificar
    # que el owner del dominio autoriza al package_name Android con el SHA-256 dado.
    # Por default nginx no sirve rutas con dot leading — hay que exponer esta location
    # explicita antes del pattern general de .json (que da expires 1y — incorrecto aca).
    location = /.well-known/assetlinks.json {
      try_files $uri =404;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600";
    }

    # TC-008 (#195): assets estaticos deben devolver 404 real cuando no existen,
    # no el index.html (que rompe `import()` dinamico de Angular con
    # "Failed to fetch dynamically imported module").
    location ~* \.(?:js|mjs|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|eot)$ {
      try_files $uri =404;
      # Assets con hash → cache larga.
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # index.html nunca debe cachearse: contiene los hashes de los chunks del deploy actual.
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      expires -1;
    }

    # SPA fallback: cualquier ruta de navegacion (sin extension) cae al index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
